<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2c2154">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<title>Get ready for the magic — ParkPulse</title>
<style>
  :root { --ink:#f3f0ff; --muted:#c3b9ea; --brand:#7b5fe0; --card:rgba(255,255,255,.07);
    --border:rgba(255,255,255,.16); --good:#5ecb96; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; color:var(--ink);
    font:16px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
    background:#1a1338;
    /* Two soft lights rather than a flat panel -- the page is about a park at
       night, and one gradient reads as a template. */
    background-image:
      radial-gradient(1100px 600px at 12% -10%, rgba(155,127,240,.55), transparent 62%),
      radial-gradient(900px 620px at 92% 8%, rgba(80,196,224,.30), transparent 58%),
      radial-gradient(700px 500px at 50% 108%, rgba(255,170,120,.20), transparent 60%);
    display:grid; place-items:center; padding:1.25rem; overflow-x:hidden; }
  .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .wrap { position:relative; z-index:1; width:100%; max-width:520px; text-align:center; }
  .mila { display:block; margin:0 auto .35rem; width:132px; height:132px; border-radius:50%; border:3px solid rgba(255,255,255,.85);
    box-shadow:0 22px 60px rgba(0,0,0,.5), 0 0 0 10px rgba(123,95,224,.18);
    animation:float 5s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  @media (prefers-reduced-motion:reduce){ .mila{animation:none} }
  h1 { font-size:clamp(1.6rem,6vw,2.15rem); line-height:1.18; margin:1.1rem 0 .5rem;
    letter-spacing:-.02em; text-wrap:balance; }
  .sub { color:var(--muted); margin:0 auto 1.6rem; max-width:38ch; text-wrap:balance; }
  form { display:flex; gap:.5rem; flex-wrap:wrap; justify-content:center; }
  input { flex:1 1 15rem; min-width:0; padding:.85rem 1rem; font:inherit; color:var(--ink);
    background:rgba(0,0,0,.28); border:1px solid var(--border); border-radius:12px; }
  input::placeholder { color:rgba(220,212,255,.5); }
  input:focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
  button { flex:0 0 auto; padding:.85rem 1.5rem; font:inherit; font-weight:800; cursor:pointer;
    color:#fff; border:0; border-radius:12px; background:linear-gradient(135deg,#7b5fe0,#9b7ff0);
    box-shadow:0 10px 26px -10px rgba(123,95,224,.9); }
  button:hover { filter:brightness(1.08); }
  button[disabled] { opacity:.6; cursor:default; }
  .note { color:var(--muted); font-size:.82rem; margin:.9rem 0 0; }
  .done { background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:1.1rem 1rem; }
  .done b { color:var(--good); }
  .err { color:#ffb4b4; font-size:.85rem; margin:.6rem 0 0; min-height:1.2em; }
  .plan { display:inline-block; margin:0 0 1.1rem; padding:.3rem .8rem; border-radius:999px;
    background:var(--card); border:1px solid var(--border); font-size:.8rem; color:var(--muted); }
  .back { display:inline-block; margin-top:1.6rem; color:var(--muted); font-size:.86rem; }
  .back:hover { color:var(--ink); }
</style>

<canvas class="stars" id="stars" aria-hidden="true"></canvas>

<div class="wrap">
  <img class="mila" src="/img/mila/mila-celebrate-160.webp" alt="" width="132" height="132">
  <p class="plan" id="plan" hidden></p>
  <h1 id="h1">Get ready for the magic</h1>
  <p class="sub" id="sub">Mila is putting the finishing touches on your park day. Leave your email and she will tell you the moment she is ready.</p>

  <form id="f">
    <input id="email" type="email" inputmode="email" autocomplete="email" required placeholder="you@example.com" aria-label="Your email">
    <button id="go" type="submit">Tell me first</button>
  </form>
  <p class="err" id="err" role="alert"></p>
  <p class="note" id="note">One email, when we open. Nothing else, ever.</p>

  <a class="back" href="/" id="back">← Back to ParkPulse</a>
</div>

<script src="/i18n.js"></script>
<script>
(async () => {
  await (window.PP_READY || Promise.resolve());
  const tr = window.PP_T || ((s) => s);
  const $ = (id) => document.getElementById(id);
  const plan = new URLSearchParams(location.search).get('plan') || '';

  for (const [id, en] of [
    ['h1', 'Get ready for the magic'],
    ['sub', 'Mila is putting the finishing touches on your park day. Leave your email and she will tell you the moment she is ready.'],
    ['go', 'Tell me first'],
    ['note', 'One email, when we open. Nothing else, ever.'],
    ['back', '← Back to ParkPulse'],
  ]) $(id).textContent = tr(en);
  $('email').setAttribute('aria-label', tr('Your email'));

  // Which pass they reached for. Worth keeping: it says what they were willing
  // to pay before anybody asked them to.
  if (plan) {
    $('plan').textContent = tr('You were looking at the {}').replace('{}', plan.replace(/-/g, ' '));
    $('plan').hidden = false;
  }

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('email').value.trim();
    $('err').textContent = '';
    $('go').disabled = true;
    try {
      const r = await fetch('/api/subscribe', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email, plan: plan || 'soon' }),
      });
      if (!r.ok) throw new Error(String(r.status));
      $('f').outerHTML = '<div class="done"><b>' + tr('You are on the list.') + '</b><br>'
        + tr('Mila will write the moment the gates open.') + '</div>';
      $('note').remove(); $('err').remove();
    } catch {
      $('go').disabled = false;
      $('err').textContent = tr('That did not send — try again in a moment.');
    }
  });

  // A slow drift of fairy dust. Canvas rather than a hundred DOM nodes, and it
  // stops entirely for anyone who asked for less motion.
  const c = $('stars');
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const x = c.getContext('2d');
    let w, h, dots;
    const seed = () => {
      w = c.width = innerWidth; h = c.height = innerHeight;
      dots = Array.from({ length: Math.min(90, Math.round(w * h / 18000)) }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        r: Math.random() * 1.6 + .4, s: Math.random() * .22 + .05,
        a: Math.random() * .5 + .2,
      }));
    };
    seed(); addEventListener('resize', seed);
    (function tick() {
      x.clearRect(0, 0, w, h);
      for (const d of dots) {
        d.y -= d.s; if (d.y < -2) { d.y = h + 2; d.x = Math.random() * w; }
        x.globalAlpha = d.a; x.fillStyle = '#fff';
        x.beginPath(); x.arc(d.x, d.y, d.r, 0, 6.2832); x.fill();
      }
      requestAnimationFrame(tick);
    })();
  }
})();
</script>
