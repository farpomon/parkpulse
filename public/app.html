<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2c2154">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>ParkPulse Live</title>
<style>
  :root {
    --bg: #f7f5ff; --card: #fff; --ink: #251d3d; --muted: #6b6485;
    --brand: #4f3ac9; --brand-soft: #eceaff; --border: #e3dff2;
    --green: #1d7a4f; --green-soft: #e2f5ea; --gold: #a06f00; --gold-soft: #fdf3d7;
    --red: #b23a48; --red-soft: #fbe9ec; --star: #e8a800; --skeleton: #ece8f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17122b; --card: #221b3d; --ink: #efecfc; --muted: #a79fc4;
      --brand: #8f7bf0; --brand-soft: #2e2455; --border: #362c5c;
      --green: #5ecb96; --green-soft: #1c3a2c; --gold: #e5b955; --gold-soft: #3d331f;
      --red: #ef8b96; --red-soft: #46242a; --skeleton: #2b2350;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 1rem 7rem; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: .75rem 0 .5rem; }
  .topline { display: flex; justify-content: space-between; align-items: center; margin-bottom: .6rem; }
  .logo { font-weight: 800; font-size: 1.15rem; color: var(--brand); text-decoration: none; }
  .topline .right { display: flex; align-items: center; gap: .6rem; }
  .updated { color: var(--muted); font-size: .78rem; }
  .iconbtn { border: 1px solid var(--border); background: var(--card); color: var(--ink); border-radius: 10px; padding: .4rem .6rem; font-size: 1rem; cursor: pointer; }
  .iconbtn:active { transform: scale(.94); }
  .iconbtn.spinning { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .destrow { margin-bottom: .5rem; }
  .destrow select { width: 100%; border: 1px solid var(--border); background: var(--card); color: var(--ink); border-radius: 12px; padding: .5rem .8rem; font-size: .95rem; font-weight: 600; }
  .tabs { display: flex; gap: .45rem; overflow-x: auto; padding-bottom: .4rem; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex-shrink: 0; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: .45rem 1rem; font-size: .9rem; font-weight: 600; cursor: pointer; color: var(--ink); }
  .tabs button.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .searchrow { position: relative; margin: .25rem 0 .6rem; }
  .searchrow input { width: 100%; border: 1px solid var(--border); background: var(--card); color: var(--ink); border-radius: 12px; padding: .6rem 2.4rem .6rem 1rem; font-size: 1rem; }
  .searchrow .clear { position: absolute; right: .4rem; top: 50%; transform: translateY(-50%); border: none; background: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; display: none; padding: .3rem; }
  .crowdline { color: var(--muted); font-size: .82rem; margin: 0 0 .5rem; }
  .crowdline b { color: var(--ink); }
  .ride { display: flex; align-items: center; gap: .6rem; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: .65rem .8rem; margin: .5rem 0; }
  .ride input[type=checkbox] { width: 1.2rem; height: 1.2rem; accent-color: var(--brand); flex-shrink: 0; }
  .ride .mid { flex: 1; min-width: 0; }
  .ride .name { font-weight: 600; font-size: .95rem; line-height: 1.3; }
  .delta { font-size: .75rem; font-weight: 700; margin-top: .1rem; }
  .delta.below { color: var(--green); }
  .delta.above { color: var(--red); }
  .delta.even { color: var(--muted); font-weight: 500; }
  .star { border: none; background: none; font-size: 1.25rem; cursor: pointer; color: var(--border); padding: .2rem; flex-shrink: 0; }
  .star.on { color: var(--star); }
  .bell { border: none; background: none; font-size: 1.05rem; cursor: pointer; padding: .2rem; flex-shrink: 0; filter: grayscale(1); opacity: .45; }
  .bell.on { filter: none; opacity: 1; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 18px 18px 0 0; padding: 1.25rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom)); z-index: 31; display: none; max-width: 640px; margin: 0 auto; }
  .sheet.open, .sheet-bg.open { display: block; }
  .sheet h3 { margin: 0 0 .25rem; font-size: 1.05rem; }
  .sheet p { margin: 0 0 .8rem; color: var(--muted); font-size: .88rem; }
  .sheet-opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
  .sheet-opts button { border: 1px solid var(--border); background: var(--bg); color: var(--ink); border-radius: 10px; padding: .6rem .2rem; font-weight: 700; cursor: pointer; font-size: .9rem; }
  .sheet .cancel { margin-top: .8rem; width: 100%; border: none; background: none; color: var(--muted); cursor: pointer; padding: .5rem; font-size: .9rem; }
  .wait { font-weight: 800; border-radius: 9px; padding: .3rem .55rem; min-width: 3.9rem; text-align: center; font-size: .9rem; flex-shrink: 0; }
  .wait.low { background: var(--green-soft); color: var(--green); }
  .wait.mid { background: var(--gold-soft); color: var(--gold); }
  .wait.high { background: var(--red-soft); color: var(--red); }
  .wait.closed { background: var(--skeleton); color: var(--muted); font-weight: 600; }
  .skeleton .sk { height: 3.4rem; border-radius: 14px; background: linear-gradient(90deg, var(--skeleton) 25%, var(--card) 50%, var(--skeleton) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; margin: .5rem 0; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .state { text-align: center; padding: 2.5rem 1rem; color: var(--muted); }
  .btn { border: none; border-radius: 12px; padding: .65rem 1.3rem; font-weight: 700; font-size: .95rem; cursor: pointer; background: var(--brand); color: #fff; }
  .planbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 2px solid var(--brand); padding: .7rem 1rem calc(.7rem + env(safe-area-inset-bottom)); display: none; z-index: 20; }
  .planbar.visible { display: block; }
  .planbar .inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; font-size: .9rem; }
  .planbar select { border: 1px solid var(--border); background: var(--bg); color: var(--ink); border-radius: 8px; padding: .4rem .5rem; font-size: .9rem; }
  .planbar label.lunch { display: flex; align-items: center; gap: .3rem; color: var(--muted); }
  .plan, .upsell { border-radius: 14px; padding: 1.1rem 1.25rem; margin-top: 1rem; }
  .plan { background: var(--card); border: 1px solid var(--border); }
  .plan h2 { margin: 0 0 .35rem; font-size: 1.15rem; }
  .plan .savings { color: var(--green); font-weight: 700; font-size: .9rem; margin-bottom: .6rem; }
  .step { display: flex; gap: .8rem; padding: .55rem 0; border-bottom: 1px solid var(--border); }
  .step:last-child { border-bottom: none; }
  .step .time { font-weight: 800; color: var(--brand); min-width: 4.9rem; font-size: .9rem; }
  .step .what { font-size: .92rem; }
  .step .why { color: var(--muted); font-size: .8rem; }
  .upsell { background: linear-gradient(135deg, #2c2154, #4f3ac9); color: #fff; text-align: center; }
  .upsell a { color: #ffd75e; font-weight: 700; }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: .8rem; border-top: 1px solid var(--border); padding-top: 1rem; }
  footer a { color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <div class="topline">
      <a class="logo" href="/">⚡ ParkPulse</a>
      <span class="right">
        <span class="updated" id="updated"></span>
        <button class="iconbtn" id="refresh" title="Refresh waits" aria-label="Refresh waits">↻</button>
      </span>
    </div>
    <div class="destrow"><select id="dest" aria-label="Choose destination"></select></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="searchrow">
      <input type="search" id="search" placeholder="Search rides…" aria-label="Search rides">
      <button class="clear" id="clear-search" aria-label="Clear search">✕</button>
    </div>
  </header>

  <p class="crowdline" id="crowdline"></p>
  <div id="rides" class="skeleton"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <div id="plan-out"></div>

  <footer>
    Wait-time data powered by <a href="https://queue-times.com">Queue-Times.com</a>.
    Unofficial fan tool — not affiliated with The Walt Disney Company.
    <a href="/guide">Free strategy guide</a>
  </footer>
</div>

<div class="planbar" id="planbar">
  <div class="inner">
    <strong id="picked-count"></strong>
    <select id="start-hour" aria-label="Start time"></select>
    <span>→</span>
    <select id="end-hour" aria-label="End time"></select>
    <label class="lunch"><input type="checkbox" id="lunch"> lunch</label>
    <label class="lunch" id="show-wrap" style="display:none"><input type="checkbox" id="show-cb"> <span id="show-short">show</span></label>
    <button class="btn" id="build" style="margin-left:auto">Plan it</button>
  </div>
</div>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet">
  <h3 id="sheet-title"></h3>
  <p>Get a push alert when the wait drops under:</p>
  <div class="sheet-opts" id="sheet-opts"></div>
  <button class="cancel" id="sheet-cancel">Cancel</button>
</div>

<script>
  const FREE_PARK = 'magic-kingdom';
  // Crowd multiplier on current wait by hour (rope drop low, midday peak, last hour lowest).
  const HOURLY = { 7: .45, 8: .4, 9: .55, 10: .8, 11: 1.0, 12: 1.1, 13: 1.15, 14: 1.15, 15: 1.1, 16: 1.0, 17: .9, 18: .85, 19: .75, 20: .6, 21: .45, 22: .35, 23: .3 };
  const RIDE_MINUTES = 15;

  let parks = {};
  let pushKey = '';
  let current = FREE_PARK;
  let rides = [];
  let lastData = null;
  let query = '';
  // Everything is unlocked while the server's PRO_GATE is off (launch preview);
  // once it's on, a valid pass token (purchased or dev code) unlocks Pro.
  let isPro = false;
  const passToken = () => localStorage.getItem('pp-pass') || '';
  const api = (path, opts = {}) => fetch(path, { ...opts, headers: { ...(opts.headers || {}), ...(passToken() && { 'x-pass': passToken() }) } });
  const favs = new Set(JSON.parse(localStorage.getItem('pp-favs') || '[]'));
  const myAlerts = JSON.parse(localStorage.getItem('pp-alerts') || '{}'); // rideName -> threshold
  const pickedNames = new Set();

  const $ = (id) => document.getElementById(id);

  function saveFavs() { localStorage.setItem('pp-favs', JSON.stringify([...favs])); }
  function saveAlerts() { localStorage.setItem('pp-alerts', JSON.stringify(myAlerts)); }

  const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

  function urlB64ToU8(b64) {
    const pad = '='.repeat((4 - (b64.length % 4)) % 4);
    const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
  }

  async function getPushSubscription() {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      if ((await Notification.requestPermission()) !== 'granted') throw new Error('denied');
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToU8(pushKey) });
    }
    return sub;
  }

  function waitClass(r) {
    if (!r.open) return 'closed';
    if (r.wait >= 60) return 'high';
    if (r.wait >= 30) return 'mid';
    return 'low';
  }

  function deltaHtml(r) {
    if (!r.open || r.typical == null || lastData.source !== 'live') return '';
    const d = r.wait - r.typical;
    if (d <= -10) return `<div class="delta below">▼ ${-d} min below typical — go now</div>`;
    if (d >= 10) return `<div class="delta above">▲ ${d} min above typical</div>`;
    return `<div class="delta even">≈ typical for this ride</div>`;
  }

  function crowdNow() {
    const p = parks[current] || {};
    const hoursTxt = p.open != null ? `Typical hours ${hourLabel(p.open)}–${hourLabel(p.close)}` : '';
    const showTxt = p.show ? ` · 🎆 ${p.show.name} ~${hourLabel(p.show.hour)}` : '';
    const h = new Date().getHours();
    const m = HOURLY[h];
    let crowd;
    if (p.open != null && (h < p.open || h >= p.close)) crowd = 'Park likely closed right now.';
    else if (m == null) crowd = '';
    else if (m <= 0.6) crowd = '<b>Light crowds right now</b> — best time to hit a headliner.';
    else if (m >= 1.05) crowd = '<b>Peak crowds right now</b> — good time for shows, food, or short lines.';
    else crowd = '<b>Moderate crowds right now</b> — pick your battles.';
    return `${crowd} ${hoursTxt}${showTxt}`;
  }

  function setupPlanner() {
    const p = parks[current] || { open: 9, close: 21 };
    const hours = [];
    for (let h = p.open; h <= p.close; h++) hours.push(h);
    $('start-hour').innerHTML = `<option value="now">Now</option>` + hours.slice(0, -1).map((h) => `<option value="${h}">${hourLabel(h)}</option>`).join('');
    $('end-hour').innerHTML = hours.slice(1).map((h) => `<option value="${h}">${hourLabel(h)}</option>`).join('');
    $('end-hour').value = String(p.close);
    if (p.show) {
      $('show-wrap').style.display = 'flex';
      $('show-short').textContent = '🎆 ' + p.show.name.split(' ')[0];
      $('show-cb').checked = true;
    } else {
      $('show-wrap').style.display = 'none';
    }
  }

  let dest = null;

  function renderTabs() {
    const groups = [...new Set(Object.values(parks).map((p) => p.group))];
    if (!dest || !groups.includes(dest)) dest = parks[current]?.group || groups[0];
    $('dest').innerHTML = groups.map((g) => `<option ${g === dest ? 'selected' : ''}>${g}</option>`).join('');
    $('tabs').innerHTML = Object.entries(parks).filter(([, p]) => p.group === dest).map(([slug, p]) =>
      `<button role="tab" data-slug="${slug}" class="${slug === current ? 'active' : ''}">${p.name}${!isPro && slug !== FREE_PARK ? ' 🔒' : ''}</button>`
    ).join('');
    $('tabs').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      const slug = b.dataset.slug;
      if (!isPro && slug !== FREE_PARK) { showUpsell(); return; }
      if (slug === current) return;
      current = slug;
      localStorage.setItem('pp-park', slug);
      pickedNames.clear();
      load();
    }));
  }

  function showUpsell() {
    $('plan-out').innerHTML = `<div class="upsell"><strong>Every Disney &amp; Universal park worldwide + the plan builder are in the Trip Pass.</strong><br>
      $19.99 for 30 days — less than one Lightning Lane ride for a family of four.<br><br>
      <a href="/#pricing">Get your Trip Pass →</a><br>
      <a href="#" id="redeem-link" style="font-weight:400;font-size:.85rem;opacity:.85">Have a pass code?</a></div>`;
    $('redeem-link').addEventListener('click', async (e) => {
      e.preventDefault();
      const code = prompt('Enter your pass code:');
      if (!code) return;
      try {
        const res = await fetch('/api/pass/redeem', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code }) });
        const data = await res.json();
        if (!res.ok) throw new Error();
        localStorage.setItem('pp-pass', data.token);
        isPro = true;
        $('plan-out').innerHTML = '';
        load();
      } catch { alert("That code didn't work."); }
    });
    $('plan-out').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function visibleRides() {
    const q = query.trim().toLowerCase();
    const list = q ? rides.filter((r) => r.name.toLowerCase().includes(q)) : rides;
    return [...list].sort((a, b) =>
      (favs.has(b.name) - favs.has(a.name)) || (b.open - a.open) || (b.wait - a.wait)
    );
  }

  function renderRides() {
    const list = visibleRides();
    $('rides').classList.remove('skeleton');
    if (!list.length) {
      $('rides').innerHTML = `<div class="state">No rides match “${query}”.</div>`;
      return;
    }
    $('rides').innerHTML = list.map((r) => `
      <div class="ride">
        <input type="checkbox" data-name="${encodeURIComponent(r.name)}" ${pickedNames.has(r.name) ? 'checked' : ''} ${r.open ? '' : 'disabled'} aria-label="Add ${r.name} to plan">
        <button class="star ${favs.has(r.name) ? 'on' : ''}" data-name="${encodeURIComponent(r.name)}" aria-label="Favorite ${r.name}">★</button>
        <span class="mid"><span class="name">${r.name}</span>${deltaHtml(r)}</span>
        <button class="bell ${myAlerts[r.name] ? 'on' : ''}" data-name="${encodeURIComponent(r.name)}" title="${myAlerts[r.name] ? `Alert set: under ${myAlerts[r.name]} min (tap to remove)` : 'Alert me when the wait drops'}" aria-label="Wait alert for ${r.name}">🔔</button>
        <span class="wait ${waitClass(r)}">${r.open ? r.wait + ' min' : 'Closed'}</span>
      </div>`).join('');
    $('rides').querySelectorAll('input[type=checkbox]').forEach((cb) => cb.addEventListener('change', () => {
      const name = decodeURIComponent(cb.dataset.name);
      cb.checked ? pickedNames.add(name) : pickedNames.delete(name);
      updatePlanbar();
    }));
    $('rides').querySelectorAll('.star').forEach((btn) => btn.addEventListener('click', () => {
      const name = decodeURIComponent(btn.dataset.name);
      favs.has(name) ? favs.delete(name) : favs.add(name);
      saveFavs();
      renderRides();
    }));
    $('rides').querySelectorAll('.bell').forEach((btn) => btn.addEventListener('click', () => bellTap(decodeURIComponent(btn.dataset.name))));
  }

  // --- Wait-drop alerts ---
  let sheetRide = null;

  async function bellTap(name) {
    if (!isPro) { showUpsell(); return; }
    if (!pushSupported()) { alert('Push alerts need a browser with notification support. On iPhone, add ParkPulse to your Home Screen first (Share → Add to Home Screen).'); return; }
    if (myAlerts[name]) {
      try {
        const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();
        if (sub) await fetch('/api/push/alerts/cancel', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint, ride: name }) });
      } catch {}
      delete myAlerts[name];
      saveAlerts();
      renderRides();
      return;
    }
    sheetRide = name;
    $('sheet-title').textContent = name;
    const r = rides.find((x) => x.name === name);
    const opts = [20, 30, 45, 60].filter((t) => !r || !r.open || t < r.wait);
    $('sheet-opts').innerHTML = (opts.length ? opts : [20]).map((t) => `<button data-t="${t}">${t} min</button>`).join('');
    $('sheet-opts').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => setAlert(+b.dataset.t)));
    $('sheet').classList.add('open');
    $('sheet-bg').classList.add('open');
  }

  function closeSheet() {
    $('sheet').classList.remove('open');
    $('sheet-bg').classList.remove('open');
  }

  async function setAlert(threshold) {
    const name = sheetRide;
    closeSheet();
    try {
      const sub = await getPushSubscription();
      const res = await api('/api/push/alerts', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ subscription: sub.toJSON(), park: current, ride: name, threshold }),
      });
      if (!res.ok) throw new Error();
      myAlerts[name] = threshold;
      saveAlerts();
      renderRides();
    } catch (e) {
      alert(e.message === 'denied'
        ? 'Notifications are blocked for this site — enable them in your browser settings to use alerts.'
        : "Couldn't set the alert — check your connection and try again.");
    }
  }

  function updatePlanbar() {
    const n = pickedNames.size;
    $('planbar').classList.toggle('visible', n > 0);
    $('picked-count').textContent = `${n} ride${n === 1 ? '' : 's'}`;
  }

  function updatedLabel() {
    if (!lastData) return '';
    const mins = Math.round((Date.now() - new Date(lastData.updatedAt)) / 60000);
    const age = mins <= 0 ? 'just now' : `${mins} min ago`;
    return `${lastData.source === 'live' ? 'Live' : 'Typical (demo)'} · ${age}`;
  }

  function hourLabel(h) {
    const whole = Math.floor(h) % 24;
    const mins = Math.round((h - Math.floor(h)) * 60);
    const ampm = whole >= 12 ? 'PM' : 'AM';
    const disp = whole % 12 === 0 ? 12 : whole % 12;
    return `${disp}:${String(mins).padStart(2, '0')} ${ampm}`;
  }

  function buildPlan() {
    if (!isPro) { showUpsell(); return; }
    const p = parks[current] || { open: 9, close: 21 };
    let t = $('start-hour').value === 'now'
      ? new Date().getHours() + Math.ceil(new Date().getMinutes() / 30) * 0.5
      : +$('start-hour').value;
    if (t < p.open) t = p.open;
    const end = +$('end-hour').value;
    if (end <= t) { alert('End time must be after start time.'); return; }
    const remaining = rides.filter((r) => pickedNames.has(r.name) && r.open);
    if (!remaining.length) return;
    const standbyNow = remaining.reduce((s, r) => s + r.wait, 0);
    let lunchDone = !$('lunch').checked;
    const show = p.show;
    const attendShow = !!(show && $('show-cb').checked && end > show.hour);
    let showDone = !attendShow;
    const steps = [];
    while (remaining.length && t < end) {
      if (!lunchDone && t >= 12) {
        steps.push({ time: t, break: '🍔 Lunch break', why: 'Peak-crowd hour — perfect time to be out of line' });
        t += 0.75;
        lunchDone = true;
        continue;
      }
      if (!showDone && t >= show.hour - 0.25) {
        steps.push({ time: Math.max(t, show.hour), break: `🎆 ${show.name}`, why: 'Grab a spot a few minutes early' });
        t = show.hour + show.duration;
        showDone = true;
        continue;
      }
      let mult = HOURLY[Math.floor(t)] ?? 1;
      let why;
      if (show && !attendShow && t >= show.hour && t < show.hour + 1) {
        mult *= 0.6; // crowds are at the show — the guide's 30-50% dip
        why = `Crowds are at ${show.name} — lines plummet`;
      }
      const bestIdx = (mult <= 0.6)
        ? remaining.reduce((m, r, i, arr) => (r.wait > arr[m].wait ? i : m), 0)
        : remaining.reduce((m, r, i, arr) => (r.wait < arr[m].wait ? i : m), 0);
      const ride = remaining.splice(bestIdx, 1)[0];
      const predicted = Math.max(5, Math.round(ride.wait * mult / 5) * 5);
      steps.push({ time: t, ride, predicted, why: why || (mult <= 0.6 ? 'Low-crowd window — headliner time' : mult >= 1.05 ? 'Peak hours — short line to knock out' : 'Moderate crowds') });
      t += (predicted + RIDE_MINUTES) / 60;
    }
    if (!showDone && end > show.hour) {
      steps.push({ time: Math.max(t, show.hour), break: `🎆 ${show.name}`, why: 'Cap off the night' });
    }
    const planned = steps.filter((s) => s.ride).reduce((s, x) => s + x.predicted, 0);
    const saved = Math.max(0, standbyNow - planned - remaining.reduce((s, r) => s + r.wait, 0));
    $('plan-out').innerHTML = `<div class="plan">
      <h2>Your plan</h2>
      ${saved > 0 ? `<div class="savings">≈ ${saved} min less waiting than riding them all right now</div>` : ''}
      ${steps.map((s) => s.break
        ? `<div class="step"><span class="time">${hourLabel(s.time)}</span><span class="what">${s.break}<br><span class="why">${s.why}</span></span></div>`
        : `<div class="step"><span class="time">${hourLabel(s.time)}</span><span class="what"><b>${s.ride.name}</b> · ~${s.predicted} min wait<br>
           <span class="why">${s.why}</span></span></div>`
      ).join('')}
      ${remaining.length ? `<p class="why" style="color:var(--muted)">Didn't fit: ${remaining.map((r) => r.name).join(', ')} — extend your hours or grab Lightning Lane for these.</p>` : ''}
    </div>`;
    $('plan-out').scrollIntoView({ behavior: 'smooth' });
  }

  let plannerPark = null;

  async function load(opts = {}) {
    renderTabs();
    if (plannerPark !== current) { setupPlanner(); plannerPark = current; }
    if (!opts.silent) {
      $('rides').classList.add('skeleton');
      $('rides').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';
    }
    try {
      const res = await api(`/api/waits/${current}`);
      if (res.status === 402) { // pass expired mid-session
        isPro = false;
        current = FREE_PARK;
        renderTabs();
        showUpsell();
        return load({ silent: true });
      }
      if (!res.ok) throw new Error(res.status);
      lastData = await res.json();
      rides = lastData.rides;
      $('crowdline').innerHTML = crowdNow();
      $('updated').textContent = updatedLabel();
      if (lastData.source === 'unavailable') {
        $('rides').classList.remove('skeleton');
        $('rides').innerHTML = `<div class="state">Live waits for ${lastData.park} aren't available right now — try again in a bit.<br><br><button class="btn" id="retry">Retry</button></div>`;
        $('retry').addEventListener('click', () => load());
        updatePlanbar();
        return;
      }
      renderRides();
      updatePlanbar();
    } catch {
      $('rides').classList.remove('skeleton');
      $('rides').innerHTML = `<div class="state">Couldn't load wait times — check your connection.<br><br><button class="btn" id="retry">Try again</button></div>`;
      $('retry').addEventListener('click', () => load());
    }
  }

  // Controls
  $('refresh').addEventListener('click', async () => {
    $('refresh').classList.add('spinning');
    await load({ silent: true });
    $('refresh').classList.remove('spinning');
  });
  $('search').addEventListener('input', (e) => {
    query = e.target.value;
    $('clear-search').style.display = query ? 'block' : 'none';
    renderRides();
  });
  $('clear-search').addEventListener('click', () => {
    query = '';
    $('search').value = '';
    $('clear-search').style.display = 'none';
    renderRides();
  });
  $('build').addEventListener('click', buildPlan);
  $('sheet-bg').addEventListener('click', closeSheet);
  $('sheet-cancel').addEventListener('click', closeSheet);
  $('dest').addEventListener('change', (e) => {
    dest = e.target.value;
    const first = Object.entries(parks).find(([, p]) => p.group === dest);
    if (!first) return;
    if (!isPro && first[0] !== FREE_PARK && !Object.entries(parks).some(([s, p]) => p.group === dest && s === FREE_PARK)) {
      renderTabs(); // show the locked tabs for this destination
      showUpsell();
      return;
    }
    current = isPro ? first[0] : FREE_PARK;
    localStorage.setItem('pp-park', current);
    pickedNames.clear();
    load();
  });

  // Boot: resolve access (launch preview or a valid pass), restore park, load.
  (async () => {
    try {
      const c = await (await fetch('/api/config')).json();
      parks = c.parks;
      pushKey = c.pushKey || '';
      if (!c.proGate) {
        isPro = true;
      } else if (passToken()) {
        try {
          const v = await (await api('/api/pass/verify')).json();
          isPro = Boolean(v.valid);
          if (!v.valid) localStorage.removeItem('pp-pass'); // expired — clean up
        } catch { isPro = false; }
      }
      const saved = localStorage.getItem('pp-park');
      if (saved && parks[saved] && (isPro || saved === FREE_PARK)) current = saved;
      else if (!isPro) current = FREE_PARK;
    } catch {
      parks = { [FREE_PARK]: { name: 'Magic Kingdom', group: 'Walt Disney World', open: 9, close: 22, show: null } };
    }
    load();
  })();
  setInterval(() => load({ silent: true }), 5 * 60 * 1000);
  setInterval(() => { $('updated').textContent = updatedLabel(); }, 30 * 1000);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
