<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2c2154">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<title>Welcome to ParkPulse</title>
<style>
  :root { --bg: #f7f5ff; --card: #fff; --ink: #251d3d; --muted: #6b6485; --brand: #4f3ac9; --border: #e3dff2; --green: #1d7a4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17122b; --card: #221b3d; --ink: #efecfc; --muted: #a79fc4; --brand: #8f7bf0; --border: #362c5c; --green: #5ecb96; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 2.5rem 2rem; max-width: 420px; margin: 1rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--muted); }
  .ok { color: var(--green); font-weight: 700; }
  .btn { display: inline-block; background: var(--brand); color: #fff; border: none; border-radius: 12px; padding: .75rem 1.75rem; font-weight: 700; font-size: 1rem; text-decoration: none; cursor: pointer; margin-top: 1rem; }
</style>
<div class="card" id="card">
  <h1>⚡ Activating your pass…</h1>
  <p>One moment while we confirm your purchase.</p>
</div>
<script>
  (async () => {
    const card = document.getElementById('card');
    const sessionId = new URLSearchParams(location.search).get('session_id');
    if (!sessionId) {
      card.innerHTML = '<h1>Hmm, nothing to activate</h1><p>This page activates a pass after checkout.</p><a class="btn" href="/">Back to ParkPulse</a>';
      return;
    }
    try {
      const session = localStorage.getItem('pp-session');
      const res = await fetch('/api/pass/claim', {
        method: 'POST',
        headers: { 'content-type': 'application/json', ...(session && { 'x-session': session }) },
        body: JSON.stringify({ session_id: sessionId }),
      });
      const data = await res.json();
      // This link lives in a Stripe receipt forever, so it will be opened
      // again long after the pass it bought has run out. Say that plainly
      // instead of sending them round the "wait and refresh" loop below.
      if (res.status === 410) {
        card.innerHTML = '<h1>This pass has expired</h1><p>The pass you bought here has run out. Grab another whenever you are heading back to the parks.</p><a class="btn" href="/#pricing">See passes →</a>';
        return;
      }
      if (!res.ok) throw new Error(data.error || 'claim failed');
      // A gift: nothing lands on this device. The buyer gets the link to
      // forward, and a note of where it has already been sent.
      if (data.gift) {
        try {
          if (data.conversion && typeof gtag === 'function') {
            gtag('event', 'conversion', { send_to: data.conversion, value: Number(data.usd) || 0, currency: 'USD', transaction_id: sessionId });
          }
        } catch {}
        const sent = data.to ? `<p class="ok">We've emailed it to <b>${data.to.replace(/[&<>]/g, '')}</b>.</p>` : '';
        card.innerHTML = `<h1>Your gift is ready 🎁</h1>
          <p class="ok">${data.label} · ${data.days} days</p>${sent}
          <p>${data.to ? 'You can also send them this link yourself:' : 'Send them this link — it works once, and the days start counting when they open it:'}</p>
          <input id="gift-link" readonly value="${data.link}" style="width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:10px;padding:.6rem .8rem;font-size:.95rem;margin:.4rem 0">
          <button class="btn" id="gift-copy">Copy link</button>
          <p><a href="/app">Open ParkPulse →</a></p>`;
        document.getElementById('gift-copy').onclick = () => {
          try { navigator.clipboard?.writeText(data.link); } catch {}
          document.getElementById('gift-copy').textContent = 'Copied!';
        };
        return;
      }
      localStorage.setItem('pp-pass', data.token);
      // The sale, reported to Google Ads once. The checkout session id is the
      // transaction id, so a refresh of this page cannot count it twice.
      try {
        if (data.conversion && typeof gtag === 'function') {
          gtag('event', 'conversion', { send_to: data.conversion, value: Number(data.usd) || 0, currency: 'USD', transaction_id: sessionId });
        }
      } catch {}
      const until = new Date(data.exp).toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
      const hasAccount = Boolean(localStorage.getItem('pp-email'));
      card.innerHTML = `<h1>You're in! 🎉</h1>
        <p class="ok">${data.label || 'Your pass is'} active until ${until}</p>
        <p>Every park, the plan builder, and wait-drop alerts are unlocked${hasAccount ? ' on your account' : ' on this device'}.</p>
        ${hasAccount ? '' : '<p>Tip: create a free account (👤 in the app) and your pass will follow your login onto any device.</p>'}
        <a class="btn" href="/app">Open ParkPulse →</a>`;
    } catch {
      card.innerHTML = `<h1>Almost there</h1>
        <p>We couldn't confirm the payment yet. If you just paid, wait a few seconds and refresh this page. Your receipt email from Stripe contains this link.</p>
        <button class="btn" onclick="location.reload()">Try again</button>`;
    }
  })();
</script>
